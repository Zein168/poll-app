<div class="new-survey">
  <div class="new-survey__body">
    <img src="assets/survey_status.svg" alt="" />
    <div class="new-survey__header">
      <div class="new-survey__header-title">
        <h3>Create new survey</h3>
      </div>

      <div class="new-survey__header-actions">
        <button type="button" aria-label="Cancel">
          <span>Cancel</span>
          <img src="assets/close.svg" alt="" />
        </button>
      </div>
    </div>

    <main class="new-survey__form">
      <div class="new-survey__left-container">
        <!-- Section 1 -->
        <section class="new-survey__details">
          <div class="new-survey__field">
            <label for="survey-name">Survey name</label>
            <div class="new-survey__input-row">
              <input id="survey-name" type="text" />
              <img src="assets/delete.svg" alt="" />
            </div>
          </div>

          <div class="new-survey__field">
            <label for="end-date">Set end date (optional)</label>
            <div class="new-survey__input-row">
              <input id="end-date" type="date" />
              <img src="assets/delete.svg" alt="" />
            </div>
          </div>
        </section>

        <!-- Section 2 -->
        <section class="new-survey__question-card">
          <div class="new-survey__field">
            <div class="new-survey__field-box">
              <label for="question-text">1. Question</label>
              <img src="assets/delete.svg" alt="" />
            </div>
            <input id="question-text" type="text" value="Which date would work best for you?" />
          </div>

          <div class="new-survey__answers">
            <p>Answers</p>

            <label class="new-survey__checkbox">
              <input type="checkbox" />
              <span>Allow multiple answers.</span>
            </label>

            <div class="new-survey__answer-row">
              <label for="answer-a">A.</label>
              <input id="answer-a" type="text" />
            </div>

            <div class="new-survey__answer-row">
              <label for="answer-b">B.</label>
              <input id="answer-b" type="text" />
            </div>

            <a class="new-survey__add-answer" href="#">
              <span>Add answer</span>
              <img src="assets/add_circle.svg" alt="" />
            </a>
          </div>
        </section>
      </div>

      <!-- Section 3 -->
      <section class="new-survey__description">
        <div class="new-survey__field new-survey__field--right">
          <label for="description">Description text (optional)</label>
          <div class="new-survey__input-row">
            <input id="description" type="text" />
            <img src="assets/delete.svg" alt="" />
          </div>
        </div>

        <div class="new-survey__actions">
          <button type="button" class="new-survey__add-question">
            Add next question
            <img src="assets/add_circle.svg" alt="" />
          </button>
        </div>
      </section>
    </main>
    <button type="button" class="new-survey__publish-button">
      <img src="assets/publish_button.svg" alt="" />
    </button>
  </div>
</div>
