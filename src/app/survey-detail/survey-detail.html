<header class="survey-detail-header">
  <div class="header-content">
    <img src="assets/menu_2.svg" alt="" />
    <p class="logo">Poll<br />App</p>
  </div>

  <button class="create-survey-button" type="button" routerLink="/new-survey">Create survey</button>
</header>

<main class="details-main">
  <section class="card-section">
    <img src="assets/published.svg" alt="" />
    <div class="survey-meta">
      <div class="survey-meta-item">
        <p>Ends on</p>
        <p>{{ survey()?.end_date }}</p>
      </div>
      <p>Category:</p>
      <p>{{ survey()?.categories }}</p>
    </div>
    <div>
      @if (survey()) {
        <article class="question-card">
          <h2>{{ survey()?.title }}</h2>
          <p>{{ survey()?.description }}</p>
        </article>
      } @else {
        <p>Umfrage wird geladen oder wurde nicht gefunden.</p>
      }
    </div>
    <div class="questions">
      
    </div>
  </section>
  <section class="servey-results"></section>
</main>
